<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Rich Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2b2" />
      <stop offset="30%" stop-color="#f5c756" />
      <stop offset="70%" stop-color="#df9b1e" />
      <stop offset="100%" stop-color="#8c5806" />
    </linearGradient>

    <!-- Dark Casino Felt Radial Background -->
    <radialGradient id="chipBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3d1220" />
      <stop offset="60%" stop-color="#19060d" />
      <stop offset="100%" stop-color="#090104" />
    </radialGradient>

    <!-- Center Disc Radial -->
    <radialGradient id="innerBg" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4a1526" />
      <stop offset="70%" stop-color="#1f0610" />
      <stop offset="100%" stop-color="#0c0206" />
    </radialGradient>

    <!-- Glowing Accent -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f5c756" flood-opacity="0.45" />
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Outer Shadow / Border -->
  <circle cx="256" cy="256" r="240" fill="url(#chipBg)" stroke="url(#goldGrad)" stroke-width="14" filter="url(#subtleShadow)" />

  <!-- Casino Chip Edge Markings (8 notches around circumference) -->
  <g fill="url(#goldGrad)">
    <!-- Top & Bottom -->
    <rect x="238" y="16" width="36" height="34" rx="4" />
    <rect x="238" y="462" width="36" height="34" rx="4" />
    <!-- Left & Right -->
    <rect x="16" y="238" width="34" height="36" rx="4" />
    <rect x="462" y="238" width="34" height="36" rx="4" />
    <!-- 45-degree diagonals -->
    <rect x="238" y="16" width="36" height="34" rx="4" transform="rotate(45 256 256)" />
    <rect x="238" y="462" width="36" height="34" rx="4" transform="rotate(45 256 256)" />
    <rect x="16" y="238" width="34" height="36" rx="4" transform="rotate(45 256 256)" />
    <rect x="462" y="238" width="34" height="36" rx="4" transform="rotate(45 256 256)" />
  </g>

  <!-- Inset Gold Ring with Stitched Dashes -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="14 10" opacity="0.85" />

  <!-- Center Inset Plate -->
  <circle cx="256" cy="256" r="162" fill="url(#innerBg)" stroke="url(#goldGrad)" stroke-width="7" />

  <!-- Fine Inner Beaded Ring -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="#f5c756" stroke-width="2" stroke-dasharray="4 6" opacity="0.6" />

  <!-- Ace of Spades Gambling Icon (Centerpiece) -->
  <g filter="url(#goldGlow)">
    <!-- Spade Head -->
    <path
      d="M 256 122
         C 230 178 152 242 152 294
         C 152 336 188 358 226 348
         C 240 344 250 334 256 324
         C 262 334 272 344 286 348
         C 324 358 360 336 360 294
         C 360 242 282 178 256 122 Z"
      fill="url(#goldGrad)"
    />
    <!-- Spade Stem / Stand -->
    <path
      d="M 245 328
         C 245 350 224 382 202 390
         L 310 390
         C 288 382 267 350 267 328 Z"
      fill="url(#goldGrad)"
    />
  </g>

  <!-- Flanking Casino Suits -->
  <!-- Left Red Heart -->
  <path
    d="M 126 252
       C 126 244 120 238 112 238
       C 106 238 102 242 100 246
       C 98 242 94 238 88 238
       C 80 238 74 244 74 252
       C 74 263 88 274 100 282
       C 112 274 126 263 126 252 Z"
    fill="#ef4444"
    opacity="0.95"
  />

  <!-- Right Red Diamond -->
  <polygon points="412,238 426,258 412,278 398,258" fill="#ef4444" opacity="0.95" />

  <!-- Top Golden Card Crown / Stars -->
  <g fill="url(#goldGrad)">
    <polygon points="256,76 260,86 270,86 262,92 265,102 256,96 247,102 250,92 242,86 252,86" />
    <polygon points="220,84 223,92 231,92 225,97 227,105 220,100 213,105 215,97 209,92 217,92" transform="rotate(-8 220 94)" />
    <polygon points="292,84 295,92 303,92 297,97 299,105 292,100 285,105 287,97 281,92 289,92" transform="rotate(8 292 94)" />
  </g>
</svg>

